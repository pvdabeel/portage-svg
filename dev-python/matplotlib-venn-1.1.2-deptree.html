  const vb = svg.getAttribute("viewBox").split(" ").map(Number);
  const rect = container.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width, my = (e.clientY - rect.top) / rect.height;
  const nw = vb[2] / factor, nh = vb[3] / factor;
  const nx = vb[0] + (vb[2] - nw) * mx, ny = vb[1] + (vb[3] - nh) * my;
  svg.setAttribute("viewBox", `${nx} ${ny} ${nw} ${nh}`);
  document.getElementById("zoom-level").textContent = Math.round(zoom * 100) + "%";
}, {passive: false});
render();
</script>
<script>
function toggleTheme() {
  const html = document.documentElement;
  const cur = html.getAttribute("data-theme") || "dark";
  const next = cur === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", next);
  document.getElementById("theme-btn").innerHTML = next === "light" ? "&#9788;" : "&#9790;";
  localStorage.setItem("deptree-theme", next);
}
(function() {
  const saved = localStorage.getItem("deptree-theme");
  if (saved) {
    document.documentElement.setAttribute("data-theme", saved);
    document.getElementById("theme-btn").innerHTML = saved === "light" ? "&#9788;" : "&#9790;";
  }
})();
</script>
</body>
</html>
