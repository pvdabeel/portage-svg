  const light = html.getAttribute("data-theme") === "light";
  if (light) html.removeAttribute("data-theme");
  else html.setAttribute("data-theme", "light");
  try { localStorage.setItem("png-theme", light ? "dark" : "light"); } catch (e) {}
}
</script>
